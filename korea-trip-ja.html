<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4泊5日 韓国旅行</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7385;--line:#e4e7ee;--ac:#3b6cf6;--acs:#e8eefe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#9aa3b5;--line:#2a3140;--ac:#7d9bff;--acs:#232c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mut:#9aa3b5;--line:#2a3140;--ac:#7d9bff;--acs:#232c47;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.55}
#lock{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 26px;width:100%;max-width:340px;text-align:center}
.box h1{font-size:20px;margin:8px 0 4px}.box p{color:var(--mut);font-size:14px;margin:0 0 18px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--tx)}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#err{color:#e5484d;font-size:13px;min-height:18px;margin-top:8px}
#app{display:none;max-width:680px;margin:0 auto;padding:22px 16px 48px}
header h1{font-size:24px;margin:0}header p{color:var(--mut);margin:4px 0 14px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.legend span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mut)}
.day{margin-bottom:26px}
.dh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dh b{background:var(--ac);color:#fff;border-radius:8px;padding:2px 9px;font-size:13px}
.dh h2{font-size:17px;margin:0}.dh small{color:var(--mut)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
summary::-webkit-details-marker{display:none}
.ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--acs);display:flex;align-items:center;justify-content:center;font-size:19px}
.t{flex:1;min-width:0}.t div{font-weight:600;font-size:15px}.t span{font-size:12.5px;color:var(--mut)}
summary::after{content:"›";color:var(--mut);font-size:22px;transition:transform .2s}
details[open] summary::after{transform:rotate(90deg)}
.body{padding:2px 16px 14px 62px;font-size:14px;color:var(--mut)}
.body ul{margin:0;padding-left:16px}.body li{margin:2px 0}
.note{background:var(--acs);color:var(--tx);border-radius:10px;padding:9px 12px;font-size:13px;margin:6px 0 10px}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div id="lock"><div class="box">
<div style="font-size:38px">🔒</div>
<h1>4泊5日 韓国旅行</h1><p>パスワードを入力してください</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off">
<button id="go">入る</button><div id="err"></div>
</div></div>

<div id="app">
<header><h1>🇰🇷 4泊5日 韓国旅行</h1><p>2026.10.31(土) – 11.04(水) · 仁川 / ソウル</p>
<div class="legend"><span>✈️ 航空券</span><span>🚇 電車・地下鉄</span><span>🏨 宿泊</span><span>🍽️ 食事</span><span>📍 観光</span><span>🤝 待ち合わせ</span><span>🚗 レンタカー</span><span>⛴️ 漢江バス</span></div></header>
<main id="main"></main>
<footer>項目をタップすると詳細が表示されます</footer>
</div>

<script>
var HASH="3f1e4d09fe1c6deef91ba4bcc3b3afff";
var D=[
{n:"DAY 1",d:"10/31 (土)",h:"出国・富平へ",i:[
["🚇","日暮里 → 成田空港 第2ターミナル","08:25 → 09:05",["日暮里 08:25 発","成田空港 第2ターミナル 09:05 着"]],
["✈️","東京 → 仁川","11:20 (T3) → 14:15 (T1)",["イXXX航空","東京 11:20 T3 発","仁川 14:15 T1 着"]],
["🏨","東横INN 仁川富平 チェックイン","15:00",["チェックイン 15:00","チェックアウト 11/1(日) 11:00"]]
]},
{n:"DAY 2",d:"11/01 (日)",h:"富平 → 城北洞 → 仁寺洞・誕生日会",i:[
["🏨","東横INN 仁川富平 チェックアウト","11:00",["チェックアウト 11:00"]],
["🤝","テXヒョンさんの車でお迎え","10:00 富平 → 15:00 仁寺洞",["富平でテXヒョンさんの車に乗車","ホテルに行く前に城北洞(ソンブクドン)でヌルンジ鶏粥(ヌルンジ・ペクスク)","ホテル到着、テXヒョンさんとバイバイ 👋","15:00 仁寺洞に到着"]],
["🏨","N285ホテル 仁寺洞 チェックイン","15:00",["チェックイン 15:00","チェックアウト 11/3(火) 11:00"]],
["🍽️","誕生日会・うなぎ / ラム肉(カグンさん＋オ・ヒョンさん)","18:00 仁寺洞のホテルにお迎え",["夕方6時に仁寺洞のホテルまでお迎えに来てくれる","カグンさんとオ・ヒョンさんの誕生日会を兼ねて、うなぎ・ラム肉の夕食"]]
]},
{n:"DAY 3",d:"11/02 (月)",h:"ソウル観光・漢江バス",i:[
["📍","仁寺洞・昭格洞・景福宮・昌慶宮・北村韓屋村","午前から · 仁寺洞のホテルから出発",["午前から観光スタート","ホテル → 仁寺洞 → 昭格洞","景福宮 → 昌慶宮 → 北村韓屋村"]],
["📍","ハヌル公園(空の公園)","北村韓屋村 → ハヌル公園",["漢江ラーメンは船に乗る前に"]],
["⛴️","漢江バス(マゴク → チャムシル)","マゴク船着場から乗船",["ハヌル公園 → マゴク船着場","マゴク → 蚕室(チャムシル) 漢江クルーズ"]],
["📍","蚕室 ロッテワールドタワー","蚕室",["下船後に移動"]],
["📍","聖水洞・ソウルの森","聖水洞エリア → ソウルの森",["聖水洞周辺を散策してからソウルの森へ"]]
]},
{n:"DAY 4",d:"11/03 (火)",h:"ホテル移動・仁川ドライブ",i:[
["🏨","N285ホテル 仁寺洞 チェックアウト","11:00",["チェックアウト 11:00"]],
["🚇","ソウル → ウンソ(電車)","ホテルオーラ仁川方面",["ソウルからウンソ(雲西)まで電車で移動"]],
["🏨","ホテルオーラ仁川 チェックイン","15:00",["チェックイン 15:00","チェックアウト 11/4(水) 11:00"]],
["🚗","レンタカーでドライブ","16:00 – 20:00(22:00 返却)",["ホテルオーラ周辺のドライブのみ","車の返却 22:00"]],
["📍","永宗島 イェダンポ + 海が見えるカフェ","イェダンポ公営駐車場",["イェダンポ公営駐車場に駐車","海を望むカフェ"]]
]},
{n:"DAY 5",d:"11/04 (水)",h:"帰国",i:[
["🏨","ホテルオーラ仁川 チェックアウト","11:00",["チェックアウト 11:00",'<div class="note">⚠️ フライトは 08:35 発のため、実際にはそれよりずっと早く出発します。</div>']],
["✈️","仁川 → 東京","08:35 (T1) → 10:55 (T2)",["トXXX航空","仁川 08:35 T1 発","東京 10:55 T2 着"]]
]}
];
var FOOD=[["🍽️","食べたいもの","キンパ・ビビンバ・ヘジャンクク・サムギョプサル・冷麺・イサックトースト・漢江ラーメン",["キンパ(韓国のり巻き)","ビビンバ","ヘジャンクク(酔い覚ましスープ)","サムギョプサル","冷麺","イサックトースト","漢江ラーメン(遊覧船に乗る前に)"]]];
function row(r){
 var b=r[3].map(function(x){return x.indexOf("<div")===0?x:"<li>"+x+"</li>"}).join("");
 b=b.replace(/(<li>.*<\/li>)/,"<ul>$1</ul>");
 return '<details><summary><div class="ic">'+r[0]+'</div><div class="t"><div>'+r[1]+'</div><span>'+r[2]+'</span></div></summary><div class="body">'+b+'</div></details>';
}
function render(){
 var h="";
 D.forEach(function(x){h+='<section class="day"><div class="dh"><b>'+x.n+'</b><h2>'+x.h+'</h2><small>'+x.d+'</small></div>'+x.i.map(row).join("")+'</section>';});
 h+='<section class="day"><div class="dh"><b>FOOD</b><h2>食事リスト</h2></div>'+FOOD.map(row).join("")+'</section>';
 document.getElementById("main").innerHTML=h;
}
function enter(){
 var v=document.getElementById("pw").value;
 if(window.CryptoJS&&CryptoJS.MD5(v.trim()).toString()===HASH){
  document.getElementById("lock").style.display="none";
  document.getElementById("app").style.display="block";render();
 }else{document.getElementById("err").textContent="パスワードが正しくありません";}
}
document.getElementById("go").onclick=enter;
document.getElementById("pw").onkeydown=function(e){if(e.key==="Enter")enter();};
</script>
</body>
</html>
