<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한국 여행 일정 페이지">
  <title>한국 여행 일정</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #202636;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 460px);
      padding: 32px;
      box-sizing: border-box;
      border: 1px solid #e2e6ef;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(31 49 86 / 9%);
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 0 0 24px; color: #697286; }
    nav { display: grid; gap: 12px; }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border: 1px solid #e2e6ef;
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      font-weight: 650;
    }
    a:hover, a:focus-visible { border-color: #3b6cf6; outline: none; }
    a span:last-child { color: #3b6cf6; font-size: 1.2rem; }
    @media (prefers-color-scheme: dark) {
      :root { background: #12151c; color: #e8ebf2; }
      main { background: #1b202b; border-color: #2a3140; }
      p { color: #9aa3b5; }
      a { border-color: #2a3140; }
    }
  </style>
</head>
<body>
  <main>
    <h1>한국 여행 일정 🇰🇷</h1>
    <p>원하는 언어를 선택해 여행 일정을 확인하세요.</p>
    <nav aria-label="언어 선택">
      <a href="korea-trip.html"><span>한국어</span><span aria-hidden="true">→</span></a>
      <a href="korea-trip-ja.html" lang="ja"><span>日本語</span><span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
